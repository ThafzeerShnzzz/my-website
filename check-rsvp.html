<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check My RSVP — O.K.P</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--paper:#f8efd9;--red:#b20f3b;--dark:#8f0c31;--ink:#403322}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff9,transparent 25%),linear-gradient(135deg,#fbf4e3,var(--paper),#f5e5c5);font-family:'Cormorant Garamond',serif}main{width:min(650px,92%);margin:auto;padding:45px 0;text-align:center}.logo{width:min(380px,82%)}.eyebrow{font:500 10px Montserrat;letter-spacing:4px;color:var(--dark);margin:15px}.card{border:1px solid #b20f3b44;padding:38px 28px;position:relative;background:#fff8e538}.card:before{content:"";position:absolute;inset:8px;border:1px solid #b20f3b20;pointer-events:none}h1{font-size:44px;color:var(--dark);margin:5px 0 8px}.script{font:400 38px Allura;color:var(--red)}p{font-size:18px}.fields{max-width:410px;margin:25px auto;text-align:left}label{display:block;font:600 9px Montserrat;letter-spacing:2px;color:var(--dark);margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #b20f3b55;background:#fffaf0;font:500 15px Montserrat;color:var(--ink);outline:none}button{width:100%;padding:15px;background:var(--red);color:var(--paper);border:1px solid var(--dark);font:600 10px Montserrat;letter-spacing:2px;cursor:pointer;margin-top:18px}.result{display:none;margin:25px auto 0;padding:25px 18px;border-top:1px solid #b20f3b44}.status{font:600 11px Montserrat;letter-spacing:2px;color:var(--red)}.msg{font-size:20px;margin:12px 0}.code{font:500 10px Montserrat;letter-spacing:2px}.back{display:inline-block;margin-top:24px;color:var(--dark);font:600 9px Montserrat;letter-spacing:2px;text-decoration:none}</style></head>
<body><main><div class="eyebrow">ISTEDA COMMUNITY PRESENTS</div><img src="okp1.png" class="logo"><div class="card"><div class="script">Find your invitation</div><h1>Check My RSVP</h1><p>Enter the same details you used while registering.</p><div class="fields"><label>REGISTRATION ID</label><input id="code" placeholder="OKP-0011" autocomplete="off"><label>WHATSAPP NUMBER</label><input id="phone" placeholder="+971..." inputmode="tel"><button id="check">CHECK MY RSVP</button></div><div class="result" id="result"><div class="status" id="status"></div><div class="msg" id="msg"></div><div class="code" id="shown"></div></div></div><a class="back" href="index.html">← BACK TO WEDDING HOUSE</a></main>
<script>
const URL='https://fbdkfzstxufvmjnkzzif.supabase.co';
const KEY='sb_publishable_X1jt3-YBCSZ0Pmk0cMV4ng_TqN9LNYm';
const btn=document.getElementById('check'),res=document.getElementById('result');
btn.onclick=async()=>{let code=document.getElementById('code').value.trim().toUpperCase(),phone=document.getElementById('phone').value.trim();if(!code||!phone){alert('Please enter your Registration ID and WhatsApp number.');return}btn.disabled=true;btn.textContent='CHECKING...';res.style.display='none';try{let r=await fetch(URL+'/rest/v1/rpc/check_okp_rsvp',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_registration_code:code,p_whatsapp:phone})});if(!r.ok)throw new Error();let d=await r.json();let x=Array.isArray(d)?d[0]:d;if(!x){show('NOT FOUND','We couldn’t find a matching RSVP. Check your Registration ID and WhatsApp number.',code);return}let s=(x.payment_status||'').toLowerCase();if(s==='approved')show('REGISTRATION CONFIRMED ✓','Payment verified. You’re officially on the guest list! ❤️',code);else if(s==='rejected')show('PAYMENT NOT APPROVED','We couldn’t verify your payment. Please contact the Wedding House.',code);else show('PAYMENT VERIFICATION PENDING','Your payment proof has reached us. The Wedding House is checking it.',code)}catch(e){show('CHECK UNAVAILABLE','The status checker is not active yet. Please try again shortly.',code)}finally{btn.disabled=false;btn.textContent='CHECK MY RSVP'}};
function show(s,m,c){document.getElementById('status').textContent=s;document.getElementById('msg').textContent=m;document.getElementById('shown').textContent=c;res.style.display='block'}
</script></body></html>
