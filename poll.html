<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKP Staycation Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --wine: #4c1729;
  --wine-dark: #2e0c18;
  --text: #301d23;
  --muted: #6b525a;
  --paper: #fffdf9;
  --line: #e8d8d6;
  --accent: #8a3551;
  --serif: "Instrument Serif", Georgia, serif;
  background: #f8f2ed;
  color: var(--text);
  font: 16px/1.55 "DM Sans", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
header {
  position: relative;
  text-align: center;
  padding: 1rem max(1.25rem, env(safe-area-inset-left)) 5rem;
  background: radial-gradient(ellipse at 50% 0%, #702940, var(--wine) 48%, var(--wine-dark));
  color: #fff8ee;
}
.masthead { width: min(100%, 880px); margin: auto; text-align: left; }
.masthead a { color: inherit; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; font-size: .875rem; }
.masthead a:hover { text-decoration: underline; }
header img { display: block; width: 88px; height: auto; margin: .5rem auto .75rem; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.03; }
h1 { font-size: clamp(3.1rem, 8vw, 6rem); margin: 0; text-wrap: balance; }
h2 { font-size: clamp(2.1rem, 5vw, 3rem); margin: 0 0 .75rem; color: var(--wine); }
h3 { font-size: 1.8rem; margin: 0 0 .9rem; color: var(--wine); }
main { position: relative; width: min(calc(100% - 2rem), 880px); margin: -2.75rem auto 3.5rem; }
.poll-section {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 16px;
  padding: clamp(1rem, 4vw, 2.25rem);
  box-shadow: 0 10px 32px #3514210b;
}
.suggestion label { color: var(--muted); font-weight: 600; }
#status:empty { display: none; }
.poll-section { margin: 0 0 1rem; scroll-margin-top: 1rem; }
.poll-nav {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem .75rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 1rem;
  padding: .35rem .85rem;
}
.poll-nav a { display: inline-flex; align-items: center; min-height: 44px; color: var(--wine); font-weight: 700; font-size: .875rem; text-underline-offset: .22em; }
#questions, #ratings, #fun-questions { display: grid; gap: 1rem; }
fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0; padding: .8rem; min-width: 0; }
legend { font-weight: 700; padding-inline: .35rem; max-width: 100%; }
.choices { display: grid; gap: .45rem; }
.choices label {
  display: flex;
  align-items: center;
  gap: .55rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  min-height: 44px;
  padding: .55rem .7rem;
  background: #fcf7f4;
  cursor: pointer;
}
.choices label:has(:checked) { border-color: var(--accent); background: #f5e2e9; color: var(--wine-dark); }
.choices input { margin: 0; accent-color: var(--accent); flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.masthead a:focus-visible { outline-color: #fff8ee; }
.respondent-name, .fun-answer, textarea {
  display: block;
  width: 100%;
  min-height: 44px;
  border: 1px solid #bea9ad;
  border-radius: 8px;
  padding: .65rem .75rem;
  background: #fff;
  color: var(--text);
  font: inherit;
}
.fun-round { padding: 1rem; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.fun-round label { display: block; font-weight: 600; }
.fun-answer { margin: .35rem 0 .95rem; }
.fun-answer:last-child { margin-bottom: 0; }
textarea { margin-top: .5rem; min-height: 112px; resize: vertical; }
button { border: 0; border-radius: 8px; background: var(--wine); color: #fff; padding: .7rem 1.1rem; min-height: 44px; font: inherit; font-weight: 700; cursor: pointer; }
button:hover { background: var(--wine-dark); }
button:disabled { opacity: .6; cursor: wait; }
.poll-note { padding: .75rem 1rem; margin: 0 0 1rem; border-left: 3px solid var(--accent); border-radius: 4px; background: #f2e4e6; color: var(--wine-dark); }
#status { padding: .75rem 1rem; background: #f2e4e6; border-radius: 8px; }

#staycation-ratings {
  background: #1e191a;
  border-color: #433638;
  color: #fffaf6;
}
#ratingTitle { color: inherit; font-family: "DM Sans", system-ui, sans-serif; font-weight: 700; letter-spacing: -.045em; }
.rating-intro { display: flex; justify-content: space-between; align-items: end; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.rating-intro p { margin: 0; color: #dbcbd0; }
#rating-progress { font-size: .875rem; font-variant-numeric: tabular-nums; }
#ratings { grid-template-columns: minmax(0, 1fr); gap: .65rem; }
.rating-row { border-color: #57494d; background: #2c2527; padding: .75rem; }
.rating-row legend { color: #fffaf6; }
.rating-controls { display: grid; gap: .45rem 1rem; }
.rating-stars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .25rem; max-width: 285px; }
.rating-stars label {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 48px;
  border: 1px solid #615156;
  border-radius: 8px;
  color: #dccbd0;
  cursor: pointer;
}
.rating-stars input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.rating-stars span { font-size: 1.45rem; line-height: 1; pointer-events: none; }
.rating-stars label:has(input:checked), .rating-stars label:has(~ label input:checked) { color: #ffd395; border-color: #cc995d; background: #513726; }
.rating-stars label:has(input:focus-visible) { outline: 2px solid #ffd395; outline-offset: 3px; }
@media (hover: hover) {
  .rating-stars label:hover { border-color: #ffd395; }
}
.rating-value { margin: 0; color: #dbcbd0; font-size: .875rem; min-height: 1.55em; }
@media (min-width: 700px) {
  .rating-row { padding: .8rem 1rem 1rem; }
  .rating-controls { grid-template-columns: minmax(240px, 285px) 1fr; align-items: center; }
}

@media (min-width: 700px) {
  #questions { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
}
</style>
</head>
<body>
<header>
  <div class="masthead"><a href="index.html">← Back to OKP</a></div>
  <img src="okp1.png" alt="Oru Kalyanam Pole">
  <h1 tabindex="-1">OKP Staycation Poll</h1>
</header>
<main>

  <form id="poll-feedback">
    <nav class="poll-nav" aria-label="Poll sections">
      <a href="#review">Review</a>
      <a href="#fun">Just for fun</a>
      <a href="#suggestions">Suggestions</a>
      <a href="#staycation-ratings">Ratings</a>
    </nav>
    <p id="preview-note" class="poll-note">Preview only. Feedback collection will open once response storage is ready.</p>
    <div class="poll-section">
      <label for="respondent-name"><strong>Your name (optional)</strong></label>
      <input class="respondent-name" id="respondent-name" name="respondent-name" type="text" autocomplete="name" maxlength="100">
    </div>
    <section class="poll-section" id="review" aria-labelledby="questionTitle">
      <h2 id="questionTitle">Staycation review</h2>
      <div id="questions"></div>
    </section>
    <section class="poll-section" id="fun" aria-labelledby="funTitle">
      <h2 id="funTitle">Just for fun</h2>
      <div id="fun-questions"></div>
    </section>
    <section class="poll-section suggestion" id="suggestions" aria-labelledby="suggestionTitle">
      <h2 id="suggestionTitle">Suggestions</h2>
      <label for="suggestion">What should we do differently next time?</label>
      <textarea id="suggestion" name="suggestion" maxlength="2000"></textarea>
    </section>
    <section class="poll-section" id="staycation-ratings" aria-labelledby="ratingTitle">
      <h2 id="ratingTitle">Rate your staycation</h2>
      <div class="rating-intro">
        <p>Tap a star to rate each part, from 1 to 5.</p>
        <p id="rating-progress" role="status">0 of 8 rated</p>
      </div>
      <div id="ratings"></div>
    </section>
    <button id="submit" type="submit" hidden>Submit Feedback</button>
  </form>
  <p id="status" role="status" tabindex="-1"></p>
</main>
<script>
const SUPABASE_URL='https://fbdkfzstxufvmjnkzzif.supabase.co';
const KEY='sb_publishable_X1jt3-YBCSZ0Pmk0cMV4ng_TqN9LNYm';
const questions = [
  ["staycation","How was Staycation 3.0 — OKP?",["Insane","Just OK","Below average","Very bad"]],
  ["expectations","Did OKP meet your expectations?",["Yes","No","No comments"]],
  ["favorite-event","What did you like most at OKP?",["Sangeeth Night","Foam Party","Pool Party","Nothing"]],
  ["biggest-surprise","What surprised you the most?",["The villa","The people around me","The vibe","The food","All of the above"]],
  ["favorite-meal","Which meal did you like most?",["Breakfast","Dinner","Both","I didn’t like anything","I didn’t get any food","I don’t remember what I ate"]],
  ["breakfast-pick","Which did you like more?",["Uppumav","Puttu","What is all this?","Both"]],
  ["more-time","What did you want more time for?",["Pool Party","Foam Party","Sangeeth dancing","All of the above"]],
  ["sound-lighting","How were the sound and lights? Should we keep the setup for our next event?",["Loved both. Bring them back!","Keep the sound, change the lights","Keep the lights, change the sound","Try a different setup","I didn’t notice"]]
];
const funRounds = [
  ["sangeeth", "Sangeeth", [
    "Who was the best-dressed girl?",
    "Who was the best-dressed boy?",
    "Who spent the most time getting ready?",
    "Who was the Michael alias Jackson alias Dance Master Vikram of OKP?",
    "Who was the Bindu Panicker of OKP? (School dance-um paattum first kittunna aal)",
    "Who was the biggest show-off?",
    "Which team shocked you with their dance, Bride or Groom?",
    "Who was the best Coat-Man? (Anyone who wore a blazer)"
  ]],
  ["foam", "Foam Party", [
    "What did the foam taste like?",
    "Who force-fed you foam like your granny?",
    "Who got lost in the foam?",
    "Do you want a foam party at the next event?"
  ]],
  ["pool", "Pool Party", [
    "Did you attend the pool party?",
    "Who was the Naran in the pool? (Rakshakan)",
    "Did you find Sharjah–Dubai traffic in the pool?",
    "Would you want a foam party in the pool next time?",
    "How many bites did you get from Maneesha?"
  ]]
];
const ratings = [
  ['staycation', 'OKP Staycation'],
  ['villa', 'Stay villa'],
  ['decorations', 'Decorations'],
  ['dinner', 'Dinner'],
  ['breakfast', 'Breakfast'],
  ['vibe', 'Vibe at the villa'],
  ['dj', 'DJ system'],
  ['expectation', 'How well did OKP meet your expectations?']
];

const form = document.querySelector('#poll-feedback');
const status = document.querySelector('#status');
const submit = document.querySelector('#submit');

function addChoices(container, name, title, options) {
  const group = document.createElement('fieldset');
  const legend = document.createElement('legend');
  legend.textContent = title;
  group.append(legend);
  const choices = document.createElement('div');
  choices.className = 'choices';
  options.forEach((option, index) => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = name;
    input.value = String(index + 1);
    const caption = document.createElement('span');
    caption.textContent = option;
    label.append(input, caption);
    choices.append(label);
  });
  group.append(choices);
  container.append(group);
}

// Enable submissions after the Supabase migration has been applied and tested.
const collectionEnabled = false;
const questionList = document.querySelector('#questions');
questions.forEach(([id, title, options], index) => {
  addChoices(questionList, 'question-' + id, (index + 1) + '. ' + title, options);
});

const funList = document.querySelector('#fun-questions');
const funAnswerKeys = [];
let funNumber = 0;
funRounds.forEach(([id, title, prompts]) => {
  const round = document.createElement('section');
  round.className = 'fun-round';
  const heading = document.createElement('h3');
  heading.textContent = title;
  heading.id = 'round-' + id;
  round.setAttribute('aria-labelledby', heading.id);
  round.append(heading);
  prompts.forEach((prompt, index) => {
    const key = 'fun-' + id + '-' + (index + 1);
    funAnswerKeys.push(key);
    const label = document.createElement('label');
    label.htmlFor = key;
    label.textContent = (++funNumber) + '. ' + prompt;
    const answer = document.createElement('input');
    answer.type = 'text';
    answer.className = 'fun-answer';
    answer.id = key;
    answer.name = key;
    answer.maxLength = 240;
    round.append(label, answer);
  });
  funList.append(round);
});

const ratingList = document.querySelector('#ratings');
const ratingProgress = document.querySelector('#rating-progress');
const ratingLabels = ['Poor', 'Fair', 'Good', 'Very good', 'Excellent'];
const expectationLabels = ['Far below expectations', 'Below expectations', 'Met expectations', 'Exceeded expectations', 'Far exceeded expectations'];

ratings.forEach(([id, title]) => {
  const row = document.createElement('fieldset');
  row.className = 'rating-row';
  const legend = document.createElement('legend');
  legend.textContent = title;
  const controls = document.createElement('div');
  controls.className = 'rating-controls';
  const stars = document.createElement('div');
  stars.className = 'rating-stars';
  const value = document.createElement('p');
  value.className = 'rating-value';
  value.textContent = 'Select a rating';
  const labels = id === 'expectation' ? expectationLabels : ratingLabels;

  labels.forEach((description, index) => {
    const score = index + 1;
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'rating-' + id;
    input.value = String(score);
    input.setAttribute('aria-label', score + ' out of 5, ' + description);
    const icon = document.createElement('span');
    icon.textContent = '★';
    icon.setAttribute('aria-hidden', 'true');
    label.append(input, icon);
    stars.append(label);
    input.addEventListener('change', () => {
      value.textContent = description + ' · ' + score + '/5';
      ratingProgress.textContent = ratingList.querySelectorAll('input:checked').length + ' of ' + ratings.length + ' rated';
    });
  });

  controls.append(stars, value);
  row.append(legend, controls);
  ratingList.append(row);
});

submit.hidden = !collectionEnabled;
document.querySelector('#preview-note').hidden = collectionEnabled;

if (collectionEnabled) {
  let submissionId;
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submit.disabled) return;
    const data = new FormData(form);
    const answers = Object.fromEntries(questions.flatMap(([id]) => {
      const option = data.get('question-' + id);
      return option ? [[id, Number(option)]] : [];
    }));
    funAnswerKeys.forEach(key => {
      const answer = data.get(key).trim();
      if (answer) answers[key] = answer;
    });
    const scores = Object.fromEntries(ratings.flatMap(([id]) => {
      const score = data.get('rating-' + id);
      return score ? [[id, Number(score)]] : [];
    }));
    if (!Object.keys(answers).length && !Object.keys(scores).length && !data.get('suggestion').trim()) {
      status.textContent = 'Add at least one answer, rating, or suggestion before submitting.';
      status.focus();
      return;
    }
    submit.disabled = true;
    status.textContent = 'Sending your feedback…';
    try {
      submissionId ||= crypto.randomUUID();
      const response = await fetch(SUPABASE_URL + '/rest/v1/rpc/submit_okp_staycation_poll', {
        method: 'POST',
        headers: {apikey: KEY, 'Content-Type': 'application/json'},
        body: JSON.stringify({
          submission_id: submissionId,
          poll_answers: answers,
          poll_ratings: scores,
          poll_name: data.get('respondent-name').trim() || null,
          poll_suggestion: data.get('suggestion').trim()
        })
      });
      if (!response.ok) throw new Error('Submission failed');
      form.hidden = true;
      status.textContent = 'Feedback submitted. Thanks for being part of OKP!';
    } catch {
      status.textContent = 'We couldn’t confirm your submission. Please try again.';
      submit.disabled = false;
    }
    status.focus();
  });
}
</script>
</body>
</html>
