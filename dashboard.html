<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O.K.P Dashboard</title><style>body{margin:0;background:#f8efd9;color:#4b2a24;font-family:Arial,sans-serif}.top{background:#a70e39;color:#fff;padding:10px;text-align:center;font-size:11px;letter-spacing:2px}.wrap{max-width:1200px;margin:30px auto;padding:18px}h1{font-family:Georgia,serif;color:#a70e39}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.btn{border:0;background:#bd0d42;color:#fff;padding:10px 13px;font-weight:bold;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{background:#fff9e9;border:1px solid #ddb3aa;padding:18px}.stat b{display:block;font-size:25px;color:#a70e39}.tools{display:flex;gap:10px;margin:15px 0}.tools input,.tools select{padding:11px;border:1px solid #d8a6a0;background:#fff;box-sizing:border-box}.tools input{flex:1}.box{overflow:auto;background:#fff9e9;border:1px solid #ddb3aa}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:10px;border-bottom:1px solid #ead8d0;text-align:left;white-space:nowrap}th{background:#a70e39;color:#fff}.small{padding:7px 9px;font-size:10px;margin:2px}.reject{background:#6c5d5d}.proof{background:#7d2841}.msg{margin:12px 0;font-size:13px}.pending{color:#a36a00}.approved{color:#24723b}.rejected{color:#a00020}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tools{flex-direction:column}.head{align-items:flex-start}}
.brand{display:flex;align-items:center;gap:14px}.brand img{width:78px;height:58px;object-fit:contain}
.action-note{background:#fff4d8;border:1px solid #e2c176;padding:14px 16px;margin:18px 0;font-size:13px}.action-note b{color:#a70e39}
.status-pill{display:inline-block;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:bold}.status-pill.verification_pending{background:#fff0c2;color:#8a5a00}.status-pill.approved{background:#dff3e4;color:#1f6935}.status-pill.rejected{background:#f6dddd;color:#9a1b25}
.copy{background:#8a6b55}.wa{background:#277449}.meta{font-size:10px;opacity:.7;margin-top:3px}
@media(max-width:700px){table,thead,tbody,tr,th,td{display:block}thead{display:none}.box{background:transparent;border:0}tr{background:#fff9e9;border:1px solid #ddb3aa;margin:12px 0;padding:12px}td{white-space:normal;border:0;padding:6px 4px}td:before{content:attr(data-label);display:block;font-size:9px;font-weight:bold;color:#a70e39;letter-spacing:.7px;margin-bottom:3px}}
</style></head><body><div class="top">ISTEDA COMMUNITY · PRIVATE ADMIN</div><main class="wrap"><div class="head"><div class="brand"><img src="okp1.png" alt="O.K.P"><div><h1>Wedding House Admin 💌</h1><div>O.K.P · Registration & Payment Review</div></div></div><button class="btn" id="logout">LOG OUT</button></div><div class="action-note">💍 <b id="actionText">Checking the wedding guest list...</b></div><div class="stats"><div class="stat"><b id="total">0</b>TOTAL</div><div class="stat"><b id="pending">0</b>PENDING</div><div class="stat"><b id="approved">0</b>APPROVED</div><div class="stat"><b id="rejected">0</b>REJECTED</div></div><div class="tools"><input id="search" placeholder="Search name, WhatsApp, OKP ID, C/O..."><select id="filter"><option value="all">All registrations</option><option value="verification_pending">Pending only</option><option value="approved">Approved only</option><option value="rejected">Rejected only</option></select><button class="btn" id="refresh">REFRESH</button></div><div id="msg" class="msg">Loading...</div><div class="box"><table><thead><tr><th>OKP ID</th><th>NAME</th><th>WHATSAPP</th><th>C/O</th><th>PREFERENCE</th><th>PAYMENT REF</th><th>PROOF</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="dashboard.js"></script></body></html>
